<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ගණිත ප්‍රශ්නෝත්තරය</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Student Name & Code Input Screen -->
        <div id="name-screen" class="screen">
            <div class="login-box">
                <h1>ගණිත ප්‍රශ්නෝත්තරය</h1>
                <div class="input-group">
                    <label for="studentName">ඔබගේ නම ඇතුලත් කරන්න:</label>
                    <input type="text" id="studentName" placeholder="උදා: Lakmal" required>
                </div>
                <div class="input-group">
                    <label for="accessCode">Admin කෝඩ් එක ඇතුලත් කරන්න:</label>
                    <input type="password" id="accessCode" placeholder="Admin කෝඩ් එක" required>
                </div>
                <button onclick="startQuiz()">ප්‍රශ්නෝත්තරය අරඹන්න</button>
                <div class="admin-link">
                    <a href="admin.html">පරිපාලක ඇතුල් වීම</a>
                </div>
                <p id="code-message" class="message"></p>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen hidden">
            <div class="quiz-container">
                <div class="quiz-header">
                    <h2>ගණිත ප්‍රශ්නෝත්තරය</h2>
                    <div class="student-info" id="student-info"></div>
                    <div class="timers">
                        <div id="total-timer">මුළු කාලය: 75:00</div>
                        <div id="question-timer">ප්‍රශ්නය: 03:00</div>
                    </div>
                </div>
                <div class="question-section">
                    <div id="question-number">ප්‍රශ්නය 1/10</div>
                    <div id="question-text"></div>
                    <div id="question-image" class="question-image"></div>
                    <div id="answer-section" class="answer-section"></div>
                </div>
                <div class="quiz-footer">
                    <button id="next-btn" class="btn-primary">මීළඟ ප්‍රශ්නය</button>
                    <div id="progress">ප්‍රගතිය: 0%</div>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <div class="result-container">
                <h2>ප්‍රශ්නෝත්තරය අවසන්!</h2>
                <div id="student-result" class="student-result"></div>
                <div id="score-display">ඔබගේ ලකුණු: <span id="score">0</span>/10</div>
                <div id="time-taken">ප්‍රශ්නෝත්තරය සඳහා ගතවූ කාලය: <span id="time">00:00</span></div>
                <button onclick="restartQuiz()">නැවත ආරම්භ කරන්න</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
