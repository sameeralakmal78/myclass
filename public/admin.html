<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පරිපාලක පුවරුව</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Admin Login -->
        <div id="admin-login" class="screen">
            <div class="login-box">
                <h1>පරිපාලක ඇතුල් වීම</h1>
                <form id="adminLoginForm">
                    <div class="input-group">
                        <label for="adminUsername">පරිශීලක නාමය:</label>
                        <input type="text" id="adminUsername" value="admin" required>
                    </div>
                    <div class="input-group">
                        <label for="adminPassword">රහස් පදය:</label>
                        <input type="password" id="adminPassword" value="math123" required>
                    </div>
                    <button type="submit">ඇතුල් වන්න</button>
                </form>
                <div class="back-link">
                    <a href="index.html">ප්‍රශ්නෝත්තරයට ආපසු</a>
                </div>
                <p id="admin-message" class="message"></p>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-dashboard" class="screen hidden">
            <div class="admin-container">
                <h1>පරිපාලක පුවරුව</h1>
                <div class="admin-actions">
                    <button onclick="loadResults()">ලකුණු නැවත පූරණය කරන්න</button>
                    <button onclick="logout()">පිටවීම</button>
                </div>
                <div class="results-section">
                    <h2>සිසුන්ගේ ලකුණු</h2>
                    <div id="results-table" class="results-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>නම</th>
                                    <th>ලකුණු</th>
                                    <th>ප්‍රශ්න</th>
                                    <th>කාලය</th>
                                    <th>දිනය</th>
                                </tr>
                            </thead>
                            <tbody id="results-body">
                                <tr><td colspan="5" style="text-align: center;">ලබාගනු...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
